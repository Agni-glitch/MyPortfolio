{#
  Cloudinary direct-upload widget (see static/js/admin.js).
  Each uploaded image becomes a hidden <input name="{name}" value="{public_id}">.
#}
{% macro uploader(name, kind, values, multiple=false, label="Image") -%}
<div data-uploader data-kind="{{ kind }}" data-name="{{ name }}" data-multiple="{{ 'true' if multiple else 'false' }}" class="space-y-2">
  <span class="block text-sm font-medium">{{ label }}</span>
  <div data-previews class="flex flex-wrap gap-3">
    {% for pid in values if pid %}
    <figure data-item class="group relative h-28 w-40 overflow-hidden rounded-lg border border-slate-200 bg-slate-100 dark:border-slate-700 dark:bg-slate-800">
      <img src="{{ pid | cld(320, 224) }}" alt="" class="h-full w-full object-cover">
      <input type="hidden" name="{{ name }}" value="{{ pid }}">
      <button type="button" data-remove class="absolute right-1 top-1 rounded-full bg-black/70 px-2 text-sm text-white opacity-90 hover:bg-red-600" aria-label="Remove image">×</button>
    </figure>
    {% endfor %}
  </div>
  <label class="inline-flex cursor-pointer items-center gap-2 rounded-lg border border-dashed border-slate-300 px-4 py-2 text-sm text-slate-600 hover:border-brand-500 hover:text-brand-600 dark:border-slate-600 dark:text-slate-300">
    <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 20h16"/></svg>
    <span data-label>{{ "Add images" if multiple else "Upload image" }}</span>
    <input type="file" accept="image/*" class="sr-only" {{ "multiple" if multiple }}>
  </label>
  <p data-status class="text-xs text-slate-500" aria-live="polite"></p>
</div>
{%- endmacro %}
