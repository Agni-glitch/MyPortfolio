{% extends "admin/auth_base.html" %}
{% block title %}Forgot password{% endblock %}
{% block heading %}Reset password{% endblock %}
{% block form %}
<p class="mb-4 text-sm text-slate-500">Enter the admin email and we'll send a 6-digit code.</p>
<form method="post" action="/admin/forgot" class="space-y-4" data-submit-once>
  <label class="block text-sm font-medium">Email
    <input name="email" type="email" required autocomplete="username" class="{{ ui.input }}">
  </label>
  <button class="w-full rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700 disabled:opacity-60">Send code</button>
</form>
<div class="mt-5 flex justify-between text-sm">
  <a href="/admin/login" class="text-slate-500 hover:underline">← Back to login</a>
  <a href="/admin/reset" class="text-brand-600 hover:underline">I have a code</a>
</div>
{% endblock %}
