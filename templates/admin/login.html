{% extends "admin/auth_base.html" %}
{% block title %}Admin login{% endblock %}
{% block heading %}Admin sign in{% endblock %}
{% block form %}
<form method="post" action="/admin/login" class="space-y-4" data-submit-once>
  <label class="block text-sm font-medium">Email
    <input name="email" type="email" required autocomplete="username" value="{{ email or '' }}" class="{{ ui.input }}">
  </label>
  <label class="block text-sm font-medium">Password
    <input name="password" type="password" required autocomplete="current-password" class="{{ ui.input }}">
  </label>
  <button class="w-full rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700 disabled:opacity-60">Sign in</button>
</form>
<div class="mt-5 flex justify-between text-sm">
  <a href="/admin/forgot" class="text-brand-600 hover:underline">Forgot password?</a>
  <a href="/admin/register" class="text-slate-500 hover:underline">First-time setup</a>
</div>
{% endblock %}
