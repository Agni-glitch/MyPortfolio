{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="mx-auto flex max-w-xl flex-col items-center px-4 py-32 text-center">
  <p class="font-mono text-7xl font-extrabold text-brand-500">{{ code }}</p>
  <h1 class="mt-4 text-2xl font-bold text-slate-900 dark:text-white">{{ title }}</h1>
  {% if message %}<p class="mt-2 text-slate-600 dark:text-slate-400">{{ message }}</p>{% endif %}
  <a href="/" class="mt-8 rounded-lg bg-brand-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-brand-700">Back home</a>
</section>
{% endblock %}
